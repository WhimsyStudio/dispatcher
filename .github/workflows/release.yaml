name: Release npm Package
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test-build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag and package versions
        run: |
          node -e "const root = require('./package.json'); const pkg = require('./src/lib/package.json'); const tag = process.env.GITHUB_REF_NAME; if (root.version !== pkg.version || root.version.includes('-') || tag !== 'v' + root.version) { console.error('A stable release tag and matching package versions are required:', { tag, root: root.version, package: pkg.version }); process.exit(1); }"
      - name: Run native tests and type checks
        run: |
          pnpm test:native
          pnpm exec tsc --noEmit --project tsconfig.json
      - name: Run browser tests
        run: |
          pnpm exec webpack serve --config webpack.config.dev.js --host 127.0.0.1 > "$RUNNER_TEMP/dispatcher-dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dispatcher-dev.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/basic.html > /dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:9000/basic.html > /dev/null; then
            cat "$RUNNER_TEMP/dispatcher-dev.log"
            exit 1
          fi
          pnpm test:e2e-headless
      - run: pnpm run build
      - name: Verify packed package contents and entry points
        run: |
          mkdir -p "$RUNNER_TEMP/dispatcher-package-smoke"
          npm pack ./build/@whsy/dispatcher --json --pack-destination "$RUNNER_TEMP/dispatcher-package-smoke" > "$RUNNER_TEMP/dispatcher-pack.json"
          node --input-type=module -e "import fs from 'node:fs'; const [pack] = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version; const required = ['dist/index.umd.js', 'dist/index.esm.mjs', 'types/index.d.ts', 'README.md', 'README-zh.md', 'LICENSE', 'asset/logo.png']; const missing = required.filter(file => !pack.files.some(entry => entry.path === file)); if (pack.version !== version || missing.length) { console.error({ expectedVersion: version, packedVersion: pack.version, missing }); process.exit(1); }" "$RUNNER_TEMP/dispatcher-pack.json"
          archive=$(find "$RUNNER_TEMP/dispatcher-package-smoke" -maxdepth 1 -name '*.tgz' -print -quit)
          mkdir -p "$RUNNER_TEMP/dispatcher-package-smoke/consumer"
          npm install --prefix "$RUNNER_TEMP/dispatcher-package-smoke/consumer" --ignore-scripts --no-audit --no-fund "$archive"
          pushd "$RUNNER_TEMP/dispatcher-package-smoke/consumer"
          node -e "const { Provider, Processor } = require('@whsy/dispatcher'); if (!Provider || !Processor) process.exit(1)"
          node --input-type=module -e "import { Provider, Processor } from '@whsy/dispatcher'; if (!Provider || !Processor) process.exit(1)"
          cat > package-smoke.mts <<'EOF'
          import { Provider } from '@whsy/dispatcher'
          import type { UncancelableTask } from '@whsy/dispatcher'

          declare const worker: Worker
          const provider = Provider.create(worker)
          const task: UncancelableTask<number> = provider.run((value: number) => value * 2, [21])
          void task
          EOF
          popd
          pnpm exec tsc --ignoreConfig --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM "$RUNNER_TEMP/dispatcher-package-smoke/consumer/package-smoke.mts"
      - run: pnpm run publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
